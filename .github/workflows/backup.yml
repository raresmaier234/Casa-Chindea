name: 🗄️ PocketBase Backup

on:
  schedule:
    # Rulează în fiecare Luni la 03:00 UTC (06:00 ora României)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    # Permite rulare manuală din GitHub Actions tab

env:
  PB_URL: https://casa-chindea.fly.dev
  PB_ADMIN_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
  PB_ADMIN_PASSWORD: ${{ secrets.PB_ADMIN_PASSWORD }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔐 Authenticate with PocketBase
        id: auth
        run: |
          echo "Authenticating..."
          RESPONSE=$(curl -sf -X POST "$PB_URL/api/collections/_superusers/auth-with-password" \
            -H "Content-Type: application/json" \
            -d "{\"identity\":\"$PB_ADMIN_EMAIL\",\"password\":\"$PB_ADMIN_PASSWORD\"}")

          TOKEN=$(echo "$RESPONSE" | jq -r '.token')

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "❌ Authentication failed"
            echo "$RESPONSE"
            exit 1
          fi

          echo "✅ Authenticated"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: 📦 Create backup
        id: backup
        run: |
          TOKEN="${{ steps.auth.outputs.token }}"
          BACKUP_NAME="backup_$(date +%Y%m%d_%H%M%S).zip"

          echo "Creating backup: $BACKUP_NAME"

          curl -sf -X POST "$PB_URL/api/backups" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$BACKUP_NAME\"}"

          sleep 5

          echo "✅ Backup created: $BACKUP_NAME"
          echo "name=$BACKUP_NAME" >> $GITHUB_OUTPUT

      - name: ⬇️ Download backup
        run: |
          TOKEN="${{ steps.auth.outputs.token }}"
          BACKUP_NAME="${{ steps.backup.outputs.name }}"

          echo "Downloading $BACKUP_NAME..."

          # Get file token for download
          FILE_TOKEN=$(curl -sf -X POST "$PB_URL/api/files/token" \
            -H "Authorization: Bearer $TOKEN" | jq -r '.token')

          # Download with file token
          HTTP_CODE=$(curl -s -w "%{http_code}" -o "$BACKUP_NAME" \
            "$PB_URL/api/backups/$BACKUP_NAME?token=$FILE_TOKEN")

          if [ "$HTTP_CODE" != "200" ] || [ ! -s "$BACKUP_NAME" ]; then
            curl -sf -o "$BACKUP_NAME" \
              "$PB_URL/api/backups/$BACKUP_NAME" \
              -H "Authorization: Bearer $TOKEN" || true
          fi

          if [ ! -s "$BACKUP_NAME" ]; then
            echo "❌ Download failed"
            exit 1
          fi

          ls -lh "$BACKUP_NAME"
          echo "✅ Downloaded"

      - name: 📤 Upload as private Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketbase-backup-${{ steps.backup.outputs.name }}
          path: ${{ steps.backup.outputs.name }}
          retention-days: 90

      - name: 🧹 Cleanup old backups on PocketBase (keep last 4)
        run: |
          TOKEN="${{ steps.auth.outputs.token }}"

          BACKUPS=$(curl -sf "$PB_URL/api/backups" \
            -H "Authorization: Bearer $TOKEN" || echo "[]")

          COUNT=$(echo "$BACKUPS" | jq 'length' 2>/dev/null || echo "0")
          echo "Total backups on server: $COUNT"

          if [ "$COUNT" -gt 4 ]; then
            echo "$BACKUPS" | jq -r '.[:-4] | .[].key' | while read -r KEY; do
              echo "Deleting old backup: $KEY"
              curl -sf -X DELETE "$PB_URL/api/backups/$KEY" \
                -H "Authorization: Bearer $TOKEN" || true
            done
            echo "✅ Old backups cleaned"
          else
            echo "ℹ️ No cleanup needed"
          fi

