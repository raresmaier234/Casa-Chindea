<!DOCTYPE html>
<html lang="ro">

<head>

    <!-- Resource Hints for faster loading -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://unpkg.com">
    
    <!-- API config - must load before any fetch -->
    <script src="/js/api-config.js"></script>
    <!-- Mobile optimizations - load first -->
    <script src="/js/components/mobile-optimizations.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificare Email - Casa Chindea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/forms.css">

    <!-- Font Awesome - deferred for faster FCP -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></noscript>

    <!-- Performance loader -->
    <script src="/js/components/performance-loader.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#059669',
                        secondary: '#10b981',
                        accent: '#34d399'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.6s ease-out',
                        'pulse-slow': 'pulse 3s ease-in-out infinite',
                        'bounce-gentle': 'bounceGentle 0.6s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        bounceGentle: {
                            '0%, 20%, 50%, 80%, 100%': { transform: 'translateY(0)' },
                            '40%': { transform: 'translateY(-5px)' },
                            '60%': { transform: 'translateY(-3px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .code-input {
            width: 50px;
            height: 60px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .code-input:focus {
            border-color: #059669;
            outline: none;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        .code-input.filled {
            border-color: #059669;
            background: #f0fdf4;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-primary/10 via-accent/5 to-secondary/10 min-h-screen flex flex-col relative">
    <!-- Background Animation -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-4 -left-4 w-72 h-72 bg-primary/10 rounded-full mix-blend-multiply filter blur-xl animate-pulse-slow"></div>
        <div class="absolute -bottom-8 -right-4 w-72 h-72 bg-accent/10 rounded-full mix-blend-multiply filter blur-xl animate-pulse-slow" style="animation-delay: 1s;"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-secondary/5 rounded-full mix-blend-multiply filter blur-xl animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <!-- Navbar -->
    <nav class="glass-effect w-full top-0 z-50 relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 animate-bounce-gentle">
                        <h1 class="text-2xl font-bold text-primary">
                            <i class="fas fa-home mr-2"></i>Casa Chindea
                        </h1>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Verification Form -->
    <main class="flex-1 flex items-center justify-center py-8 px-4 relative z-10 min-h-0">
        <div class="glass-effect shadow-2xl rounded-3xl p-6 sm:p-8 max-w-md w-full animate-slide-up">
            <!-- Header -->
            <div class="text-center mb-6 sm:mb-8">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center mx-auto mb-3 sm:mb-4 shadow-lg animate-bounce-gentle">
                    <i class="fas fa-envelope-open-text text-white text-xl sm:text-2xl"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent mb-2">
                    Verificare Email
                </h2>
                <p class="text-gray-600 text-sm sm:text-base" id="email-display">
                    Am trimis un cod de verificare la <strong id="user-email"></strong>
                </p>
            </div>

            <!-- Success State -->
            <div id="verify-success" class="hidden text-center mb-4 sm:mb-6">
                <div class="w-12 h-12 sm:w-16 sm:h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3 sm:mb-4 animate-bounce-gentle">
                    <i class="fas fa-check text-green-600 text-lg sm:text-xl"></i>
                </div>
                <h3 class="text-base sm:text-lg font-semibold text-green-700 mb-2">Cont creat cu succes!</h3>
                <p class="text-green-600 text-sm sm:text-base">Te redirectăm către pagina de autentificare...</p>
            </div>

            <!-- Verification Form -->
            <form id="verify-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-3 text-center">
                        Introdu codul de 6 cifre
                    </label>
                    <div class="flex justify-center gap-2" id="code-inputs">
                        <input type="text" maxlength="1" class="code-input" data-index="0" autocomplete="off">
                        <input type="text" maxlength="1" class="code-input" data-index="1" autocomplete="off">
                        <input type="text" maxlength="1" class="code-input" data-index="2" autocomplete="off">
                        <input type="text" maxlength="1" class="code-input" data-index="3" autocomplete="off">
                        <input type="text" maxlength="1" class="code-input" data-index="4" autocomplete="off">
                        <input type="text" maxlength="1" class="code-input" data-index="5" autocomplete="off">
                    </div>
                </div>

                <button type="submit" id="verify-btn"
                    class="w-full bg-gradient-to-r from-primary to-secondary hover:from-secondary hover:to-primary text-white font-bold py-3 sm:py-4 px-6 rounded-xl text-base sm:text-lg flex items-center justify-center gap-2 transition-all duration-300 transform hover:scale-[1.02] hover:shadow-lg">
                    <i class="fas fa-check-circle"></i>
                    <span>Verifică Codul</span>
                </button>

                <div id="verify-error" class="text-red-500 text-center mt-3 sm:mt-4 p-3 bg-red-50 rounded-lg border border-red-200 hidden animate-fade-in text-sm sm:text-base">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    <span id="error-message"></span>
                </div>

                <!-- Resend Code -->
                <div class="text-center">
                    <p class="text-gray-600 text-xs sm:text-sm mb-2">
                        Nu ai primit codul?
                    </p>
                    <button type="button" id="resend-btn" class="text-primary hover:text-secondary font-semibold text-sm transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-redo mr-1"></i>
                        <span id="resend-text">Retrimite codul</span>
                    </button>
                    <p id="resend-timer" class="text-gray-500 text-xs mt-1 hidden"></p>
                </div>
            </form>

            <!-- Back to Register -->
            <div class="mt-6 sm:mt-8 text-center">
                <p class="text-gray-600 text-xs sm:text-sm">
                    Email greșit?
                    <a href="/js/pages/register.html" class="text-primary font-semibold hover:text-secondary transition-colors duration-200">
                        Înregistrează-te din nou
                    </a>
                </p>
            </div>
        </div>
    </main>

    <script>
        // Get email from URL params or localStorage
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email') || localStorage.getItem('verification_email');
        const prefilledCode = urlParams.get('code');

        // If user came from email link (has both email + code in URL), allow direct access
        const fromEmailLink = urlParams.get('email') && urlParams.get('code');

        // Guard: only allow access if register flow set the sessionStorage flags
        // OR if user arrived via email link with code
        const verificationPending = sessionStorage.getItem('verification_pending');
        const verificationEmail = sessionStorage.getItem('verification_email');

        if (!email || (!fromEmailLink && !verificationPending)) {
            window.location.href = '/js/pages/register.html';
        }

        // If from email link, set sessionStorage so resend/refresh works
        if (fromEmailLink) {
            sessionStorage.setItem('verification_pending', 'true');
            sessionStorage.setItem('verification_email', email);
        }

        document.getElementById('user-email').textContent = email;

        // Store email in localStorage for page refreshes
        if (urlParams.get('email')) {
            localStorage.setItem('verification_email', email);
        }

        // Code input handling
        const codeInputs = document.querySelectorAll('.code-input');
        const verifyForm = document.getElementById('verify-form');
        const verifyBtn = document.getElementById('verify-btn');
        const verifySuccess = document.getElementById('verify-success');
        const errorDiv = document.getElementById('verify-error');
        const errorMessage = document.getElementById('error-message');
        const resendBtn = document.getElementById('resend-btn');
        const resendText = document.getElementById('resend-text');
        const resendTimer = document.getElementById('resend-timer');

        // If code is prefilled from URL, fill it in
        if (prefilledCode && prefilledCode.length === 6) {
            prefilledCode.split('').forEach((digit, index) => {
                codeInputs[index].value = digit;
                codeInputs[index].classList.add('filled');
            });
            // Auto-submit after a short delay
            setTimeout(() => {
                verifyForm.dispatchEvent(new Event('submit'));
            }, 500);
        }

        // Handle code input
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {
                const value = this.value;

                // Only allow numbers
                this.value = value.replace(/[^0-9]/g, '');

                if (this.value) {
                    this.classList.add('filled');
                    // Move to next input
                    if (index < codeInputs.length - 1) {
                        codeInputs[index + 1].focus();
                    }
                } else {
                    this.classList.remove('filled');
                }

                // Hide error when user starts typing
                errorDiv.classList.add('hidden');
            });

            input.addEventListener('keydown', function(e) {
                // Backspace handling
                if (e.key === 'Backspace' && !this.value && index > 0) {
                    codeInputs[index - 1].focus();
                    codeInputs[index - 1].value = '';
                    codeInputs[index - 1].classList.remove('filled');
                }

                // Arrow key navigation
                if (e.key === 'ArrowLeft' && index > 0) {
                    codeInputs[index - 1].focus();
                }
                if (e.key === 'ArrowRight' && index < codeInputs.length - 1) {
                    codeInputs[index + 1].focus();
                }
            });

            // Paste handling
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                pastedData.split('').forEach((digit, idx) => {
                    if (idx < codeInputs.length) {
                        codeInputs[idx].value = digit;
                        codeInputs[idx].classList.add('filled');
                    }
                });
                if (pastedData.length === 6) {
                    codeInputs[5].focus();
                }
            });
        });

        // Focus first input on load
        codeInputs[0].focus();

        // Form submission
        verifyForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Reset error state
            errorDiv.classList.add('hidden');
            errorMessage.textContent = '';

            // Get code from inputs
            const code = Array.from(codeInputs).map(input => input.value).join('');

            if (code.length !== 6) {
                errorMessage.textContent = 'Te rugăm să introduci toate cele 6 cifre.';
                errorDiv.classList.remove('hidden');
                return;
            }

            // Show loading state
            verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Se verifică...';
            verifyBtn.disabled = true;

            try {
                const res = await fetch('/api/auth/verify-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Clear verification flags and tokens
                    localStorage.removeItem('verification_email');
                    sessionStorage.removeItem('verification_pending');
                    sessionStorage.removeItem('verification_email');
                    sessionStorage.removeItem('auth_token');
                    sessionStorage.removeItem('user_info');
                    localStorage.removeItem('auth_token');
                    localStorage.removeItem('user_info');

                    // Show success state
                    verifyForm.classList.add('hidden');
                    verifySuccess.classList.remove('hidden');

                    // Update success message
                    document.querySelector('#verify-success h3').textContent = 'Cont creat cu succes!';
                    document.querySelector('#verify-success p').textContent = 'Te redirectăm către pagina de autentificare...';

                    // Redirect to login page after showing success message
                    setTimeout(() => {
                        window.location.href = '/js/pages/login.html';
                    }, 2000);
                } else {
                    throw new Error(data.error || 'Eroare la verificare.');
                }
            } catch (err) {
                errorMessage.textContent = err.message || 'Eroare de conexiune la server.';
                errorDiv.classList.remove('hidden');

                // Reset button state
                verifyBtn.innerHTML = '<i class="fas fa-check-circle"></i><span>Verifică Codul</span>';
                verifyBtn.disabled = false;

                // Add shake animation
                verifyForm.classList.add('animate-pulse');
                setTimeout(() => {
                    verifyForm.classList.remove('animate-pulse');
                }, 1000);
            }
        });

        // Resend code functionality
        let resendCooldown = 60; // 60 seconds cooldown
        let resendInterval = null;

        function startResendCooldown() {
            resendBtn.disabled = true;
            resendTimer.classList.remove('hidden');

            resendInterval = setInterval(() => {
                resendCooldown--;
                resendTimer.textContent = `Poți retrimite peste ${resendCooldown} secunde`;

                if (resendCooldown <= 0) {
                    clearInterval(resendInterval);
                    resendBtn.disabled = false;
                    resendTimer.classList.add('hidden');
                    resendCooldown = 60;
                }
            }, 1000);
        }

        resendBtn.addEventListener('click', async function() {
            resendText.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>Se trimite...';
            resendBtn.disabled = true;

            try {
                const res = await fetch('/api/auth/resend-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Clear code inputs
                    codeInputs.forEach(input => {
                        input.value = '';
                        input.classList.remove('filled');
                    });
                    codeInputs[0].focus();

                    // Show success message
                    errorMessage.textContent = '✅ ' + data.message;
                    errorDiv.classList.remove('hidden');
                    errorDiv.classList.remove('text-red-500', 'bg-red-50', 'border-red-200');
                    errorDiv.classList.add('text-green-600', 'bg-green-50', 'border-green-200');

                    setTimeout(() => {
                        errorDiv.classList.add('hidden');
                        errorDiv.classList.remove('text-green-600', 'bg-green-50', 'border-green-200');
                        errorDiv.classList.add('text-red-500', 'bg-red-50', 'border-red-200');
                    }, 3000);

                    startResendCooldown();
                } else {
                    throw new Error(data.error || 'Eroare la retrimitere.');
                }
            } catch (err) {
                errorMessage.textContent = err.message;
                errorDiv.classList.remove('hidden');
            } finally {
                resendText.innerHTML = '<i class="fas fa-redo mr-1"></i>Retrimite codul';
            }
        });
    </script>
</body>

</html>
