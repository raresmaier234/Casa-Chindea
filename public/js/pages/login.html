<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Casa Chindea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#059669',
                        secondary: '#10b981',
                        accent: '#34d399'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.6s ease-out',
                        'pulse-slow': 'pulse 3s ease-in-out infinite',
                        'bounce-gentle': 'bounceGentle 0.6s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        bounceGentle: {
                            '0%, 20%, 50%, 80%, 100%': { transform: 'translateY(0)' },
                            '40%': { transform: 'translateY(-5px)' },
                            '60%': { transform: 'translateY(-3px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .form-floating {
            position: relative;
        }

        .form-floating input {
            padding-top: 1.625rem;
            padding-bottom: 0.625rem;
        }

        .form-floating label {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            padding: 1rem 0.75rem;
            pointer-events: none;
            border: 1px solid transparent;
            transform-origin: 0 0;
            transition: opacity 0.1s ease-in-out, transform 0.1s ease-in-out;
            color: #6b7280;
        }

        .form-floating input:focus~label,
        .form-floating input:not(:placeholder-shown)~label {
            opacity: 0.65;
            transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-primary/10 via-accent/5 to-secondary/10 min-h-screen flex flex-col relative overflow-hidden">
    <!-- Background Animation -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div
            class="absolute -top-4 -left-4 w-72 h-72 bg-primary/10 rounded-full mix-blend-multiply filter blur-xl animate-pulse-slow">
        </div>
        <div class="absolute -bottom-8 -right-4 w-72 h-72 bg-accent/10 rounded-full mix-blend-multiply filter blur-xl animate-pulse-slow"
            style="animation-delay: 1s;"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-secondary/5 rounded-full mix-blend-multiply filter blur-xl animate-pulse-slow"
            style="animation-delay: 2s;"></div>
    </div>
    <!-- Navbar -->
    <nav class="glass-effect w-full top-0 z-50 relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 animate-bounce-gentle">
                        <h1 class="text-2xl font-bold text-primary">
                            <i class="fas fa-home mr-2"></i>Casa Chindea
                        </h1>
                    </div>
                </div>
                <div class="hidden md:flex items-center space-x-8" id="desktop-nav">
                    <a href="/js/pages/home.html"
                        class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Acasă</a>
                    <a href="/js/pages/about.html"
                        class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Despre</a>
                    <a href="/js/pages/rooms.html"
                        class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Camere</a>
                    <a href="/js/pages/gallery.html"
                        class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Galerie</a>
                    <a href="/js/pages/booking.html"
                        class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Rezervări</a>
                    <a href="/js/pages/contact.html"
                        class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Contact</a>
                    <!-- Auth element will be dynamically added by navigation.js -->
                </div>
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-gray-700 hover:text-primary">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile menu -->
        <div id="mobile-menu" class="md:hidden hidden glass-effect border-t border-white/20 absolute w-full left-0 top-full">
            <div class="px-2 pt-2 pb-3 space-y-1" id="mobile-nav">
                <a href="/js/pages/home.html"
                    class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Acasă</a>
                <a href="/js/pages/about.html"
                    class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Despre</a>
                <a href="/js/pages/rooms.html"
                    class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Camere</a>
                <a href="/js/pages/gallery.html"
                    class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Galerie</a>
                <a href="/js/pages/booking.html"
                    class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Rezervări</a>
                <a href="/js/pages/contact.html"
                    class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Contact</a>
                <!-- Auth element will be dynamically added by navigation.js -->
            </div>
        </div>
    </nav>
    <script src="/js/components/navigation.js"></script>
    <!-- Login Form -->
    <main class="flex-1 flex items-center justify-center py-12 relative z-10">
        <div class="glass-effect shadow-2xl rounded-3xl p-8 max-w-md w-full mx-4 animate-slide-up">
            <!-- Welcome Header -->
            <div class="text-center mb-8">
                <div
                    class="w-20 h-20 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg animate-bounce-gentle">
                    <i class="fas fa-user text-white text-2xl"></i>
                </div>
                <h2
                    class="text-3xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent mb-2">
                    Bun venit!
                </h2>
                <p class="text-gray-600">Conectează-te la contul tău.</p>
            </div>

            <!-- Success/Loading States -->
            <div id="login-success" class="hidden text-center mb-6">
                <div
                    class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce-gentle">
                    <i class="fas fa-check text-green-600 text-xl"></i>
                </div>
                <h3 class="text-lg font-semibold text-green-700 mb-2">Autentificare reușită!</h3>
                <p class="text-green-600">Te redirectăm către profilul tău...</p>
            </div>

            <form id="login-form" class="space-y-6">
                <div class="form-floating">
                    <input type="email" id="email" name="email" required placeholder=" "
                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-4 focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-white/50"
                        autocomplete="username">
                    <label for="email" class="px-4">
                        <i class="fas fa-envelope mr-2 text-primary"></i>Adresa de email
                    </label>
                </div>

                <div class="form-floating">
                    <input type="password" id="password" name="password" required placeholder=" "
                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-4 focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-white/50"
                        autocomplete="current-password">
                    <label for="password" class="px-4">
                        <i class="fas fa-lock mr-2 text-primary"></i>Parola
                    </label>
                </div>

                <button type="submit" id="login-btn"
                    class="w-full bg-gradient-to-r from-primary to-secondary hover:from-secondary hover:to-primary text-white font-bold py-4 px-6 rounded-xl text-lg flex items-center justify-center gap-2 transition-all duration-300 transform hover:scale-[1.02] hover:shadow-lg">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Autentificare</span>
                </button>

                <div id="login-error"
                    class="text-red-500 text-center mt-4 p-3 bg-red-50 rounded-lg border border-red-200 hidden animate-fade-in">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    <span id="error-message"></span>
                </div>
            </form>


            <!-- User Info (when authenticated) -->
            <div id="user-info" class="hidden mt-6 text-center animate-fade-in">
                <!-- Will be populated by JavaScript -->
            </div>

            <!-- Logout Button (when authenticated) -->
            <button id="logout-btn"
                class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl text-lg flex items-center justify-center gap-2 hidden w-full mt-4 transition-all duration-300">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>

            <!-- Register Link -->
            <div class="mt-8 text-center">
                <p class="text-gray-600 text-sm">
                    Nu ai cont încă?
                    <a href="#" class="text-primary font-semibold hover:text-secondary transition-colors duration-200">
                        Înregistrează-te aici
                    </a>
                </p>
            </div>
        </div>
    </main>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.2/auth0-spa-js.production.js"></script>
    <script>
        // Configurare Auth0 pentru Casa Chindea
        // Încarcă configurația din backend pentru securitate
        let auth0Config = {
            domain: window.AUTH0_DOMAIN || "dev-casa-chindea.eu.auth0.com",
            clientId: window.AUTH0_CLIENT_ID || "YOUR_REAL_AUTH0_CLIENT_ID",
            redirect_uri: window.location.origin + "/js/pages/login.html"
        };

        // Încarcă configurația din backend
        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                if (config.auth0) {
                    auth0Config.domain = config.auth0.domain;
                    auth0Config.clientId = config.auth0.clientId;
                }
            } catch (err) {
                console.log('Using default config, backend not available:', err.message);
            }
        }
        let auth0 = null;
        async function configureClient() {
            auth0 = await createAuth0Client({
                domain: auth0Config.domain,
                clientId: auth0Config.clientId,
                authorizationParams: {
                    redirect_uri: auth0Config.redirect_uri
                }
            });
        }
        async function updateUI() {
            const isAuthenticated = await auth0.isAuthenticated();
            const logoutBtn = document.getElementById('logout-btn');
            const userInfo = document.getElementById('user-info');
            if (isAuthenticated) {
                document.getElementById('login-form').classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                const user = await auth0.getUser();
                userInfo.classList.remove('hidden');
                userInfo.innerHTML = `<div class='mb-2'><i class='fas fa-user-circle text-4xl text-primary'></i></div><div class='font-semibold'>${user.name || user.email}</div><div class='text-gray-500 text-sm'>${user.email}</div>`;
                // Salvează tokenul în sessionStorage pentru acces API
                const token = await auth0.getTokenSilently();
                sessionStorage.setItem('auth_token', token);
            } else {
                document.getElementById('login-form').classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                userInfo.classList.add('hidden');
                userInfo.innerHTML = '';
                sessionStorage.removeItem('auth_token');
            }
        }        // Login cu PocketBase
        document.getElementById('login-form').onsubmit = async function (e) {
            e.preventDefault();

            const loginBtn = document.getElementById('login-btn');
            const loginForm = document.getElementById('login-form');
            const loginSuccess = document.getElementById('login-success');
            const errorDiv = document.getElementById('login-error');
            const errorMessage = document.getElementById('error-message');

            // Reset error state
            errorDiv.classList.add('hidden');
            errorMessage.textContent = '';

            // Show loading state
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Se conectează...';
            loginBtn.disabled = true;
            loginBtn.className = loginBtn.className.replace('hover:scale-[1.02]', '');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Salvează tokenul și informațiile utilizatorului
                    sessionStorage.setItem('auth_token', data.token);
                    sessionStorage.setItem('user_info', JSON.stringify(data.user));

                    // Show success state
                    loginForm.classList.add('hidden');
                    loginSuccess.classList.remove('hidden');

                    // Redirect to profile after showing success message
                    setTimeout(() => {
                        window.location.href = '/js/pages/profile.html';
                    }, 2000);
                } else {
                    throw new Error(data.error || 'Eroare la autentificare.');
                }
            } catch (err) {
                console.error('Login error:', err);

                // Show error state
                errorMessage.textContent = err.message || 'Eroare de conexiune la server.';
                errorDiv.classList.remove('hidden');

                // Reset button state
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Autentificare</span>';
                loginBtn.disabled = false;
                loginBtn.className = loginBtn.className + ' hover:scale-[1.02]';

                // Add shake animation to form on error
                loginForm.classList.add('animate-pulse');
                setTimeout(() => {
                    loginForm.classList.remove('animate-pulse');
                }, 1000);
            }
        };

        // Actualizează UI pentru login clasic
        function updateClassicLoginUI(user) {
            const loginForm = document.getElementById('login-form');
            const logoutBtn = document.getElementById('logout-btn');
            const userInfo = document.getElementById('user-info');

            if (user) {
                loginForm.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                userInfo.innerHTML = `
                    <div class='mb-2'>
                        <i class='fas fa-user-circle text-4xl text-primary'></i>
                    </div>
                    <div class='font-semibold'>${user.name || user.email}</div>
                    <div class='text-gray-500 text-sm'>${user.email}</div>
                    <div class='text-xs text-gray-400 mt-2'>Autentificat cu PocketBase</div>
                `;

                // Actualizează butonul de logout pentru PocketBase
                logoutBtn.onclick = function () {
                    sessionStorage.removeItem('auth_token');
                    sessionStorage.removeItem('user_info');
                    location.reload();
                };
            }
        }

        // Verifică dacă utilizatorul este deja autentificat cu PocketBase
        function checkClassicAuth() {
            const token = sessionStorage.getItem('auth_token');
            const userInfo = sessionStorage.getItem('user_info');

            if (token && userInfo) {
                try {
                    const user = JSON.parse(userInfo);
                    updateClassicLoginUI(user);
                } catch (err) {
                    console.error('Error parsing user info:', err);
                    sessionStorage.removeItem('auth_token');
                    sessionStorage.removeItem('user_info');
                }
            }
        }

        // Inițializare la încărcarea paginii
        window.onload = async () => {
            // Încarcă configurația din backend
            await loadConfig();

            // Verifică autentificarea clasică
            checkClassicAuth();

            // Configurează Auth0 doar dacă credențialele sunt setate corect
            if (auth0Config.domain !== "dev-casa-chindea.eu.auth0.com" &&
                auth0Config.clientId !== "YOUR_REAL_AUTH0_CLIENT_ID" &&
                !auth0Config.domain.includes("YOUR") &&
                !auth0Config.clientId.includes("YOUR")) {
                try {
                    await configureClient();

                    // Handle redirect from Auth0
                    if (window.location.search.includes('code=') && window.location.search.includes('state=')) {
                        await auth0.handleRedirectCallback();
                        window.history.replaceState({}, document.title, "/js/pages/login.html");
                    }

                    await updateUI();

                    document.getElementById('auth0-btn').onclick = () => auth0.loginWithRedirect();
                } catch (err) {
                    console.error('Auth0 configuration error:', err);
                    // Ascunde opțiunea Auth0 dacă nu este configurată
                    document.getElementById('auth0-section').style.display = 'none';
                }
            } else {
                // Ascunde opțiunea Auth0 dacă nu este configurată
                console.log('Auth0 not configured - using placeholder credentials');
                document.getElementById('auth0-section').style.display = 'none';
            }
        };
    </script>
</body>

</html>
