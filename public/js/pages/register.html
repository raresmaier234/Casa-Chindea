<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înregistrare - Casa Chindea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#059669',
                        secondary: '#10b981',
                        accent: '#34d399'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.6s ease-out',
                        'pulse-slow': 'pulse 3s ease-in-out infinite',
                        'bounce-gentle': 'bounceGentle 0.6s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        bounceGentle: {
                            '0%, 20%, 50%, 80%, 100%': { transform: 'translateY(0)' },
                            '40%': { transform: 'translateY(-5px)' },
                            '60%': { transform: 'translateY(-3px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .form-floating {
            position: relative;
        }

        .form-floating input {
            padding-top: 1.5rem;
            padding-bottom: 0.5rem;
        }

        @media (min-width: 640px) {
            .form-floating input {
                padding-top: 1.625rem;
                padding-bottom: 0.625rem;
            }
        }

        .form-floating label {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            padding: 0.75rem;
            pointer-events: none;
            border: 1px solid transparent;
            transform-origin: 0 0;
            transition: opacity 0.1s ease-in-out, transform 0.1s ease-in-out;
            color: #6b7280;
            font-size: 0.875rem;
        }

        @media (min-width: 640px) {
            .form-floating label {
                padding: 1rem 0.75rem;
                font-size: 1rem;
            }
        }

        .form-floating input:focus~label,
        .form-floating input:not(:placeholder-shown)~label {
            opacity: 0.65;
            transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .password-strength {
            height: 4px;
            transition: all 0.3s ease;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-primary/10 via-accent/5 to-secondary/10 min-h-screen flex flex-col relative">
    <!-- Background Animation -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-4 -left-4 w-72 h-72 bg-primary/10 rounded-full mix-blend-multiply filter blur-xl animate-pulse-slow"></div>
        <div class="absolute -bottom-8 -right-4 w-72 h-72 bg-accent/10 rounded-full mix-blend-multiply filter blur-xl animate-pulse-slow" style="animation-delay: 1s;"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-secondary/5 rounded-full mix-blend-multiply filter blur-xl animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>

    <!-- Navbar -->
    <nav class="glass-effect w-full top-0 z-50 relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 animate-bounce-gentle">
                        <h1 class="text-2xl font-bold text-primary">
                            <i class="fas fa-home mr-2"></i>Casa Chindea
                        </h1>
                    </div>
                </div>
                <div class="hidden md:flex items-center space-x-8" id="desktop-nav">
                    <a href="/js/pages/home.html" class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Acasă</a>
                    <a href="/js/pages/about.html" class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Despre</a>
                    <a href="/js/pages/offers.html" class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Oferte</a>
                    <a href="/js/pages/gallery.html" class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Galerie</a>
                    <a href="/js/pages/booking.html" class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Rezervări</a>
                    <a href="/js/pages/contact.html" class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Contact</a>
                </div>
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-gray-700 hover:text-primary">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile menu -->
        <div id="mobile-menu" class="md:hidden hidden glass-effect border-t border-white/20 absolute w-full left-0 top-full">
            <div class="px-2 pt-2 pb-3 space-y-1" id="mobile-nav">
                <a href="/js/pages/home.html" class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Acasă</a>
                <a href="/js/pages/about.html" class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Despre</a>
                <a href="/js/pages/offers.html" class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Oferte</a>
                <a href="/js/pages/gallery.html" class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Galerie</a>
                <a href="/js/pages/booking.html" class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Rezervări</a>
                <a href="/js/pages/contact.html" class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Contact</a>
            </div>
        </div>
    </nav>
    <script src="/js/components/navigation.js"></script>

    <!-- Register Form -->
    <main class="flex-1 flex items-center justify-center py-8 px-4 relative z-10 min-h-0">
        <div class="glass-effect shadow-2xl rounded-3xl p-6 sm:p-8 max-w-md w-full animate-slide-up">
            <!-- Welcome Header -->
            <div class="text-center mb-6 sm:mb-8">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center mx-auto mb-3 sm:mb-4 shadow-lg animate-bounce-gentle">
                    <i class="fas fa-user-plus text-white text-xl sm:text-2xl"></i>
                </div>
                <h2 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent mb-2">
                    Creează cont
                </h2>
                <p class="text-gray-600 text-sm sm:text-base">Înregistrează-te pentru a face rezervări</p>
            </div>

            <!-- Success State -->
            <div id="register-success" class="hidden text-center mb-4 sm:mb-6">
                <div class="w-12 h-12 sm:w-16 sm:h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3 sm:mb-4 animate-bounce-gentle">
                    <i class="fas fa-check text-green-600 text-lg sm:text-xl"></i>
                </div>
                <h3 class="text-base sm:text-lg font-semibold text-green-700 mb-2">Înregistrare reușită!</h3>
                <p class="text-green-600 text-sm sm:text-base">Te redirectăm către pagina de autentificare...</p>
            </div>

            <form id="register-form" class="space-y-4 sm:space-y-5">
                <div class="form-floating">
                    <input type="text" id="name" name="name" required placeholder=" "
                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 sm:py-4 text-sm sm:text-base focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-white/50"
                        autocomplete="name">
                    <label for="name" class="px-4 text-sm sm:text-base">
                        <i class="fas fa-user mr-2 text-primary"></i>Nume complet
                    </label>
                </div>

                <div class="form-floating">
                    <input type="email" id="email" name="email" required placeholder=" "
                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 sm:py-4 text-sm sm:text-base focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-white/50"
                        autocomplete="email">
                    <label for="email" class="px-4 text-sm sm:text-base">
                        <i class="fas fa-envelope mr-2 text-primary"></i>Adresa de email
                    </label>
                </div>

                <div class="form-floating">
                    <input type="password" id="password" name="password" required placeholder=" " minlength="8"
                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 sm:py-4 text-sm sm:text-base focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-white/50"
                        autocomplete="new-password">
                    <label for="password" class="px-4 text-sm sm:text-base">
                        <i class="fas fa-lock mr-2 text-primary"></i>Parola (min. 8 caractere)
                    </label>
                </div>

                <!-- Password Strength Indicator -->
                <div class="password-strength rounded-full overflow-hidden bg-gray-200" id="password-strength">
                    <div class="h-full bg-red-500 transition-all duration-300" style="width: 0%"></div>
                </div>
                <p class="text-xs text-gray-500 -mt-2" id="password-strength-text">Introduceți o parolă</p>

                <div class="form-floating">
                    <input type="password" id="password-confirm" name="password-confirm" required placeholder=" " minlength="8"
                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 sm:py-4 text-sm sm:text-base focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-white/50"
                        autocomplete="new-password">
                    <label for="password-confirm" class="px-4 text-sm sm:text-base">
                        <i class="fas fa-lock mr-2 text-primary"></i>Confirmă parola
                    </label>
                </div>

                <div class="flex items-start">
                    <input type="checkbox" id="terms" required class="mt-1 mr-2 w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
                    <label for="terms" class="text-xs sm:text-sm text-gray-600">
                        Sunt de acord cu <a href="#" class="text-primary hover:text-secondary">termenii și condițiile</a> și <a href="#" class="text-primary hover:text-secondary">politica de confidențialitate</a>
                    </label>
                </div>

                <button type="submit" id="register-btn"
                    class="w-full bg-gradient-to-r from-primary to-secondary hover:from-secondary hover:to-primary text-white font-bold py-3 sm:py-4 px-6 rounded-xl text-base sm:text-lg flex items-center justify-center gap-2 transition-all duration-300 transform hover:scale-[1.02] hover:shadow-lg">
                    <i class="fas fa-user-plus"></i>
                    <span>Creează cont</span>
                </button>

                <div id="register-error" class="text-red-500 text-center mt-3 sm:mt-4 p-3 bg-red-50 rounded-lg border border-red-200 hidden animate-fade-in text-sm sm:text-base">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    <span id="error-message"></span>
                </div>
            </form>

            <!-- Login Link -->
            <div class="mt-6 sm:mt-8 text-center">
                <p class="text-gray-600 text-xs sm:text-sm">
                    Ai deja cont?
                    <a href="/js/pages/login.html" class="text-primary font-semibold hover:text-secondary transition-colors duration-200">
                        Autentifică-te aici
                    </a>
                </p>
            </div>
        </div>
    </main>

    <script>
        // Password strength checker
        const passwordInput = document.getElementById('password');
        const passwordStrength = document.getElementById('password-strength');
        const passwordStrengthText = document.getElementById('password-strength-text');

        passwordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;
            let text = '';
            let color = '';

            if (password.length >= 8) strength++;
            if (password.match(/[a-z]+/)) strength++;
            if (password.match(/[A-Z]+/)) strength++;
            if (password.match(/[0-9]+/)) strength++;
            if (password.match(/[$@#&!]+/)) strength++;

            const strengthBar = passwordStrength.querySelector('div');

            switch (strength) {
                case 0:
                case 1:
                    strengthBar.style.width = '20%';
                    strengthBar.style.backgroundColor = '#ef4444';
                    text = 'Parolă slabă';
                    break;
                case 2:
                    strengthBar.style.width = '40%';
                    strengthBar.style.backgroundColor = '#f59e0b';
                    text = 'Parolă medie';
                    break;
                case 3:
                    strengthBar.style.width = '60%';
                    strengthBar.style.backgroundColor = '#fbbf24';
                    text = 'Parolă bună';
                    break;
                case 4:
                    strengthBar.style.width = '80%';
                    strengthBar.style.backgroundColor = '#84cc16';
                    text = 'Parolă puternică';
                    break;
                case 5:
                    strengthBar.style.width = '100%';
                    strengthBar.style.backgroundColor = '#10b981';
                    text = 'Parolă foarte puternică';
                    break;
            }

            passwordStrengthText.textContent = text || 'Introduceți o parolă';
        });

        // Register form submission
        document.getElementById('register-form').onsubmit = async function(e) {
            e.preventDefault();

            const registerBtn = document.getElementById('register-btn');
            const registerForm = document.getElementById('register-form');
            const registerSuccess = document.getElementById('register-success');
            const errorDiv = document.getElementById('register-error');
            const errorMessage = document.getElementById('error-message');

            // Reset error state
            errorDiv.classList.add('hidden');
            errorMessage.textContent = '';

            // Get form values
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;
            const terms = document.getElementById('terms').checked;

            // Validation
            if (!terms) {
                errorMessage.textContent = 'Trebuie să accepți termenii și condițiile.';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (password !== passwordConfirm) {
                errorMessage.textContent = 'Parolele nu se potrivesc.';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (password.length < 8) {
                errorMessage.textContent = 'Parola trebuie să aibă cel puțin 8 caractere.';
                errorDiv.classList.remove('hidden');
                return;
            }

            // Show loading state
            registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Se creează contul...';
            registerBtn.disabled = true;
            registerBtn.className = registerBtn.className.replace('hover:scale-[1.02]', '');

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Show success state
                    registerForm.classList.add('hidden');
                    registerSuccess.classList.remove('hidden');

                    // Redirect to login after showing success message
                    setTimeout(() => {
                        window.location.href = '/js/pages/login.html';
                    }, 2000);
                } else {
                    throw new Error(data.error || 'Eroare la înregistrare.');
                }
            } catch (err) {
                // Show error state in UI instead of console
                errorMessage.textContent = err.message || 'Eroare de conexiune la server.';
                errorDiv.classList.remove('hidden');

                // Reset button state
                registerBtn.innerHTML = '<i class="fas fa-user-plus"></i><span>Creează cont</span>';
                registerBtn.disabled = false;
                registerBtn.className = registerBtn.className + ' hover:scale-[1.02]';

                // Add shake animation to form on error
                registerForm.classList.add('animate-pulse');
                setTimeout(() => {
                    registerForm.classList.remove('animate-pulse');
                }, 1000);
            }
        };

        // Check if already authenticated
        window.onload = function() {
            const token = sessionStorage.getItem('auth_token');
            if (token) {
                // Redirect to profile if already logged in
                window.location.href = '/js/pages/profile.html';
            }
        };
    </script>
</body>

</html>
