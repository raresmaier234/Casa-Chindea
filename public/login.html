<!DOCTYPE html>
<html lang="ro">

<head>

    <!-- Resource Hints for faster loading -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://unpkg.com">
    
    <!-- API config - must load before any fetch -->
    <script src="/js/api-config.js"></script>
    <!-- Mobile optimizations - load first -->
    <script src="/js/components/mobile-optimizations.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login - Casa Chindea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/forms.css">

    <!-- Font Awesome - deferred for faster FCP -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></noscript>

    <!-- Performance loader -->
    <script src="/js/components/performance-loader.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#059669',
                        secondary: '#10b981',
                        accent: '#34d399'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.6s ease-out',
                        'pulse-slow': 'pulse 3s ease-in-out infinite',
                        'bounce-gentle': 'bounceGentle 0.6s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        bounceGentle: {
                            '0%, 20%, 50%, 80%, 100%': { transform: 'translateY(0)' },
                            '40%': { transform: 'translateY(-5px)' },
                            '60%': { transform: 'translateY(-3px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .form-floating {
            position: relative;
        }

        .form-floating input {
            padding-top: 1.5rem;
            padding-bottom: 0.5rem;
        }
        
        @media (min-width: 640px) {
            .form-floating input {
                padding-top: 1.625rem;
                padding-bottom: 0.625rem;
            }
        }

        .form-floating label {
            position: absolute;
            top: 0;
            left: 0;
            padding: 0.75rem;
            pointer-events: none;
            border: 1px solid transparent;
            color: #6b7280;
            font-size: 0.75rem;
            /* Label is now STATIC - always stays at top */
            opacity: 0.65;
            transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
            transform-origin: 0 0;
        }
        
        @media (min-width: 640px) {
            .form-floating label {
                padding: 1rem 0.75rem;
                font-size: 0.875rem;
            }
        }

        /* Fix for autofill background color */
        .form-floating input:-webkit-autofill,
        .form-floating input:-webkit-autofill:hover,
        .form-floating input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0px 1000px rgba(255, 255, 255, 0.5) inset;
            box-shadow: 0 0 0px 1000px rgba(255, 255, 255, 0.5) inset;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* Password toggle button */
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b7280;
            transition: color 0.2s;
            z-index: 10;
        }

        .password-toggle:hover {
            color: #059669;
        }

        .form-floating-with-toggle {
            position: relative;
        }

        .form-floating-with-toggle input {
            padding-right: 3rem;
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-primary/10 via-accent/5 to-secondary/10 min-h-screen flex flex-col relative">
    <!-- Background Animation -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div
            class="absolute -top-4 -left-4 w-72 h-72 bg-primary/10 rounded-full mix-blend-multiply filter blur-xl animate-pulse-slow">
        </div>
        <div class="absolute -bottom-8 -right-4 w-72 h-72 bg-accent/10 rounded-full mix-blend-multiply filter blur-xl animate-pulse-slow"
            style="animation-delay: 1s;"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-secondary/5 rounded-full mix-blend-multiply filter blur-xl animate-pulse-slow"
            style="animation-delay: 2s;"></div>
    </div>
    <!-- Navbar -->
    <nav class="glass-effect w-full top-0 z-50 relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0 animate-bounce-gentle">
                        <h1 class="text-2xl font-bold text-primary">
                            <i class="fas fa-home mr-2"></i>Casa Chindea
                        </h1>
                    </div>
                </div>
                <div class="hidden md:flex items-center space-x-8" id="desktop-nav">
                    <a href="/home"
                        class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Acasă</a>
                    <a href="/about"
                        class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Despre</a>
                    <a href="/offers"
                        class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Oferte</a>
                    <a href="/gallery"
                        class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Galerie</a>
                    <a href="/booking"
                        class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Rezervări</a>
                    <a href="/contact"
                        class="nav-link text-gray-700 hover:text-primary transition-colors duration-200">Contact</a>
                    <!-- Auth element will be dynamically added by navigation.js -->
                </div>
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-gray-700 hover:text-primary">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile menu -->
        <div id="mobile-menu" class="md:hidden hidden glass-effect border-t border-white/20 absolute w-full left-0 top-full">
            <div class="px-2 pt-2 pb-3 space-y-1" id="mobile-nav">
                <a href="/home"
                    class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Acasă</a>
                <a href="/about"
                    class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Despre</a>
                <a href="/offers"
                    class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Oferte</a>
                <a href="/gallery"
                    class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Galerie</a>
                <a href="/booking"
                    class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Rezervări</a>
                <a href="/contact"
                    class="nav-link block px-3 py-2 text-gray-700 hover:text-primary">Contact</a>
                <!-- Auth element will be dynamically added by navigation.js -->
            </div>
        </div>
    </nav>
    <script src="/js/components/navigation.js"></script>
    <!-- Login Form -->
    <main class="flex-1 flex items-center justify-center py-8 px-4 relative z-10 min-h-0">
        <div class="glass-effect shadow-2xl rounded-3xl p-6 sm:p-8 max-w-md w-full animate-slide-up">
            <!-- Welcome Header -->
            <div class="text-center mb-6 sm:mb-8">
                <div
                    class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center mx-auto mb-3 sm:mb-4 shadow-lg animate-bounce-gentle">
                    <i class="fas fa-user text-white text-xl sm:text-2xl"></i>
                </div>
                <h2
                    class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent mb-2">
                    Bun venit!
                </h2>
                <p class="text-gray-600 text-sm sm:text-base">Conectează-te la Casa Chindea.</p>
            </div>

            <!-- Success/Loading States -->
            <div id="login-success" class="hidden text-center mb-4 sm:mb-6">
                <div
                    class="w-12 h-12 sm:w-16 sm:h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-3 sm:mb-4 animate-bounce-gentle">
                    <i class="fas fa-check text-green-600 text-lg sm:text-xl"></i>
                </div>
                <h3 class="text-base sm:text-lg font-semibold text-green-700 mb-2">Autentificare reușită!</h3>
            </div>

            <form id="login-form" class="space-y-4 sm:space-y-6">
                <div class="form-floating">
                    <input type="email" id="email" name="email" required placeholder=" "
                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 sm:py-4 text-sm sm:text-base focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-white/50"
                        autocomplete="username">
                    <label for="email" class="px-4 text-sm sm:text-base">
                        <i class="fas fa-envelope mr-2 text-primary"></i>Adresa de email
                    </label>
                </div>

                <div class="form-floating form-floating-with-toggle">
                    <input type="password" id="password" name="password" required placeholder=" "
                        class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 sm:py-4 text-sm sm:text-base focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 bg-white/50"
                        autocomplete="current-password">
                    <label for="password" class="px-4 text-sm sm:text-base">
                        <i class="fas fa-lock mr-2 text-primary"></i>Parola
                    </label>
                    <i class="password-toggle fas fa-eye" id="toggle-password" onclick="togglePassword('password', 'toggle-password')"></i>
                </div>

                <button type="submit" id="login-btn"
                    class="w-full bg-gradient-to-r from-primary to-secondary hover:from-secondary hover:to-primary text-white font-bold py-3 sm:py-4 px-6 rounded-xl text-base sm:text-lg flex items-center justify-center gap-2 transition-all duration-300 transform hover:scale-[1.02] hover:shadow-lg">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Autentificare</span>
                </button>

                <div id="login-error"
                    class="text-red-500 text-center mt-3 sm:mt-4 p-3 bg-red-50 rounded-lg border border-red-200 hidden animate-fade-in text-sm sm:text-base">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    <span id="error-message"></span>
                </div>

                <!-- Forgot password link -->
                <div class="text-right mt-2">
                    <a href="/reset-password"
                        class="text-primary text-xs sm:text-sm hover:text-secondary transition-colors duration-200">
                        <i class="fas fa-key mr-1"></i>Ai uitat parola?
                    </a>
                </div>
            </form>

            <!-- User Info (when authenticated) -->
            <div id="user-info" class="hidden mt-4 sm:mt-6 text-center animate-fade-in">
                <!-- Will be populated by JavaScript -->
            </div>

            <!-- Logout Button (when authenticated) -->
            <button id="logout-btn"
                class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-xl text-base sm:text-lg flex items-center justify-center gap-2 hidden w-full mt-4 transition-all duration-300">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>

            <!-- Register Link -->
            <div class="mt-6 sm:mt-8 text-center">
                <p class="text-gray-600 text-xs sm:text-sm">
                    Nu ai cont încă?
                    <a href="/register" class="text-primary font-semibold hover:text-secondary transition-colors duration-200">
                        Înregistrează-te aici
                    </a>
                </p>
            </div>
        </div>
    </main>
    <script defer src="https://cdn.auth0.com/js/auth0-spa-js/2.2/auth0-spa-js.production.js"></script>
    <script>
        // Password toggle functionality
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Configurare Auth0 pentru Casa Chindea
        // Încarcă configurația din backend pentru securitate
        let auth0Config = {
            domain: window.AUTH0_DOMAIN || "dev-casa-chindea.eu.auth0.com",
            clientId: window.AUTH0_CLIENT_ID || "YOUR_REAL_AUTH0_CLIENT_ID",
            redirect_uri: window.location.origin + "/login"
        };

        // Încarcă configurația din backend
        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                const config = await response.json();
                if (config.auth0) {
                    auth0Config.domain = config.auth0.domain;
                    auth0Config.clientId = config.auth0.clientId;
                }
            } catch (err) {
            }
        }
        let auth0 = null;
        async function configureClient() {
            auth0 = await createAuth0Client({
                domain: auth0Config.domain,
                clientId: auth0Config.clientId,
                authorizationParams: {
                    redirect_uri: auth0Config.redirect_uri
                }
            });
        }
        async function updateUI() {
            const isAuthenticated = await auth0.isAuthenticated();
            const logoutBtn = document.getElementById('logout-btn');
            const userInfo = document.getElementById('user-info');
            if (isAuthenticated) {
                document.getElementById('login-form').classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                const user = await auth0.getUser();
                userInfo.classList.remove('hidden');
                userInfo.innerHTML = `<div class='mb-2'><i class='fas fa-user-circle text-4xl text-primary'></i></div><div class='font-semibold'>${user.name || user.email}</div><div class='text-gray-500 text-sm'>${user.email}</div>`;
                // Salvează tokenul în sessionStorage pentru acces API
                const token = await auth0.getTokenSilently();
                sessionStorage.setItem('auth_token', token);
            } else {
                document.getElementById('login-form').classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                userInfo.classList.add('hidden');
                userInfo.innerHTML = '';
                sessionStorage.removeItem('auth_token');
            }
        }        // Login cu PocketBase
        document.getElementById('login-form').onsubmit = async function (e) {
            e.preventDefault();

            const loginBtn = document.getElementById('login-btn');
            const loginForm = document.getElementById('login-form');
            const loginSuccess = document.getElementById('login-success');
            const errorDiv = document.getElementById('login-error');
            const errorMessage = document.getElementById('error-message');

            // Reset error state
            errorDiv.classList.add('hidden');
            errorMessage.textContent = '';

            // Show loading state
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Se conectează...';
            loginBtn.disabled = true;
            loginBtn.className = loginBtn.className.replace('hover:scale-[1.02]', '');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    // Salvează tokenul și informațiile utilizatorului
                    sessionStorage.setItem('auth_token', data.token);
                    sessionStorage.setItem('user_info', JSON.stringify(data.user));

                    // Verifică dacă utilizatorul este admin și actualizează token-ul dacă este necesar
                    await checkAndRefreshAdminToken();

                    // Show success state
                    loginForm.classList.add('hidden');
                    loginSuccess.classList.remove('hidden');

                    // Check for redirect parameter
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect');

                    // Redirect to specified page or default to profile
                    setTimeout(() => {
                        if (redirect) {
                            window.location.href = redirect;
                        } else {
                            window.location.href = '/profile';
                        }
                    }, 2000);
                } else {
                    throw new Error(data.error || 'Eroare la autentificare.');
                }
            } catch (err) {
                // Show error state in UI instead of console
                errorMessage.textContent = err.message || 'Eroare de conexiune la server.';
                errorDiv.classList.remove('hidden');

                // Reset button state
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Autentificare</span>';
                loginBtn.disabled = false;
                loginBtn.className = loginBtn.className + ' hover:scale-[1.02]';

                // Add shake animation to form on error
                loginForm.classList.add('animate-pulse');
                setTimeout(() => {
                    loginForm.classList.remove('animate-pulse');
                }, 1000);
            }
        };

        // Actualizează UI pentru login clasic
        function updateClassicLoginUI(user) {
            const loginForm = document.getElementById('login-form');
            const logoutBtn = document.getElementById('logout-btn');
            const userInfo = document.getElementById('user-info');

            if (user) {
                loginForm.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                userInfo.innerHTML = `
                    <div class='mb-2'>
                        <i class='fas fa-user-circle text-4xl text-primary'></i>
                    </div>
                    <div class='font-semibold'>${user.name || user.email}</div>
                    <div class='text-gray-500 text-sm'>${user.email}</div>
                    <div class='text-xs text-gray-400 mt-2'>Autentificat cu PocketBase</div>
                `;

                // Actualizează butonul de logout pentru PocketBase
                logoutBtn.onclick = function () {
                    sessionStorage.removeItem('auth_token');
                    sessionStorage.removeItem('user_info');
                    location.reload();
                };
            }
        }

        // Verifică dacă utilizatorul este deja autentificat cu PocketBase
        function checkClassicAuth() {
            const token = sessionStorage.getItem('auth_token');
            const userInfo = sessionStorage.getItem('user_info');

            if (token && userInfo) {
                try {
                    const user = JSON.parse(userInfo);
                    updateClassicLoginUI(user);
                    // Verifică dacă utilizatorul a devenit admin între timp
                    checkAndRefreshAdminToken();
                } catch (err) {
                    // Clear invalid session data silently
                    sessionStorage.removeItem('auth_token');
                    sessionStorage.removeItem('user_info');
                }
            }
        }

        // Verifică dacă utilizatorul este admin și refreshează token-ul dacă este necesar
        async function checkAndRefreshAdminToken() {
            const token = sessionStorage.getItem('auth_token');
            if (!token) return;

            try {
                const response = await fetch('/api/auth/admin-status', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const statusData = await response.json();

                    // Dacă utilizatorul este admin în DB dar nu în token, refreshează token-ul
                    if (statusData.user.admin && !statusData.user.tokenAdmin) {
                        await refreshTokenWithAdminPermissions();
                    }
                }
            } catch (err) {
            }
        }

        // Refreshează token-ul cu permisiunile actualizate
        async function refreshTokenWithAdminPermissions() {
            const token = sessionStorage.getItem('auth_token');
            if (!token) return;

            try {
                const response = await fetch('/api/auth/refresh-token', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();

                    // Actualizează token-ul și informațiile utilizatorului
                    sessionStorage.setItem('auth_token', data.token);
                    sessionStorage.setItem('user_info', JSON.stringify(data.user));
                }
            } catch (err) {
            }
        }

        // Inițializare la încărcarea paginii
        window.onload = async () => {
            // Încarcă configurația din backend
            await loadConfig();

            // Verifică autentificarea clasică
            checkClassicAuth();

            // Configurează Auth0 doar dacă credențialele sunt setate corect
            if (auth0Config.domain !== "dev-casa-chindea.eu.auth0.com" &&
                auth0Config.clientId !== "YOUR_REAL_AUTH0_CLIENT_ID" &&
                !auth0Config.domain.includes("YOUR") &&
                !auth0Config.clientId.includes("YOUR")) {
                try {
                    await configureClient();

                    // Handle redirect from Auth0
                    if (window.location.search.includes('code=') && window.location.search.includes('state=')) {
                        await auth0.handleRedirectCallback();
                        window.history.replaceState({}, document.title, "/login");
                    }

                    await updateUI();

                    document.getElementById('auth0-btn').onclick = () => auth0.loginWithRedirect();
                } catch (err) {
                    // Hide Auth0 option if not configured properly
                    document.getElementById('auth0-section').style.display = 'none';
                }
            } else {
                // Ascunde opțiunea Auth0 dacă nu este configurată
                document.getElementById('auth0-section').style.display = 'none';
            }
        };
    </script>
</body>
