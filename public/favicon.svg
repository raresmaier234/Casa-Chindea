  <!-- Roof -->
  <polygon points="32,14 14,32 50,32" fill="white"/>
  <!-- Door -->
  <rect x="28" y="36" width="8" height="12" rx="1" fill="#059669"/>
  <!-- Door knob -->
  <circle cx="34" cy="42" r="1" fill="white"/>
  <!-- Window left -->
  <rect x="22" y="34" width="5" height="5" rx="0.5" fill="#059669"/>
  <!-- Window right -->
  <rect x="37" y="34" width="5" height="5" rx="0.5" fill="#059669"/>
  <!-- Chimney -->
  <rect x="39" y="18" width="5" height="10" rx="1" fill="white"/>
</svg>

